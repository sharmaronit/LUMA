plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def secretProperties = new Properties()
secretProperties.setProperty("signing_keystore_password", "${System.getenv('LUMA_KEYSTORE_PASSWORD')}")
secretProperties.setProperty("signing_key_password", "${System.getenv('LUMA_SIGNING_KEY_PASSWORD')}")
secretProperties.setProperty("signing_key_alias", "${System.getenv('LUMA_SIGNING_KEY_ALIAS')}")

android {
    flavorDimensions += "store"

    productFlavors {
        play {
            dimension "store"
        }
        github {
            dimension "store"
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs (for IzzyOnDroid/F-Droid)
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles (for Google Play)
        includeInBundle = false
    }

    defaultConfig {
        applicationId "app.luma.tvlauncher"
        compileSdk 36
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        debug {}
        release {
            if (localProperties['storeFile'] != null) {
                storeFile file(localProperties['storeFile'])
                storePassword localProperties['storePassword']
                keyAlias localProperties['keyAlias']
                keyPassword localProperties['keyPassword']
            } else if (file('upload-keystore.jks').exists()) {
                def storePass = System.getenv('SIGNING_KEYSTORE_PASSWORD')
                def alias = System.getenv('SIGNING_KEY_ALIAS')
                def keyPass = System.getenv('SIGNING_KEY_PASSWORD')
                if (storePass == null || alias == null || keyPass == null) {
                    throw new Exception(
                            'upload-keystore.jks is present but SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, and SIGNING_KEY_PASSWORD must be set')
                }
                storeFile file('upload-keystore.jks')
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            signingConfig signingConfigs.debug
        }
        profile {
            // Keep on-device performance experiments separate from the user's
            // installed launcher and its signing key.
            applicationIdSuffix '.profile'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('LUMA_PERFORMANCE_BUILD') == 'true') {
                applicationIdSuffix '.profile'
                signingConfig signingConfigs.debug
                manifestPlaceholders = [lumaBuildLabel: 'Luma Performance']
            } else {
                signingConfig signingConfigs.release
                manifestPlaceholders = [lumaBuildLabel: 'Luma']
            }
        }
    }

    splits {
        abi {
            // https://stackoverflow.com/a/39950584/21037183
            enable gradle.startParameter.taskNames.any {
                it.startsWith("assemble") && it.endsWith("Release")
            }
            reset()
            // CI publishes arm-only APKs; local release builds keep x86 for emulators.
            def releaseAbis = System.getenv("CI") == "true"
                ? ["arm64-v8a", "armeabi-v7a"]
                : ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]
            include(*releaseAbis)
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'app.luma.tvlauncher'

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                outputFileName = "luma-${abi}-${variant.buildType.name}.apk"
            } else {
                outputFileName = "luma-universal-${variant.buildType.name}.apk"
            }
        }
    }
}

flutter {
    source '../..'
}

// Recompile this small native layer in full. An inherited incremental/cache
// entry omitted the relocated activity while still producing a valid APK.
tasks.withType(JavaCompile).configureEach {
    options.incremental = false
    outputs.upToDateWhen { false }
    outputs.doNotCacheIf("Verify native entry points from current sources") { true }
}
