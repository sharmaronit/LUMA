name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Drift's database tests need the SQLite shared library.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      # Warnings are reported but do not fail the build; errors do.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      # Debug build: compiles the Dart app and the Java platform code
      # (notifications, sleep timer, inputs) without release signing keys.
      - name: Build debug APK
        run: flutter build apk --debug --flavor github --target-platform android-arm,android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: luma-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
